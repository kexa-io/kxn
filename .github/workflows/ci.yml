name: CI

on:
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace -- -D warnings

  wasm:
    # kxn-core and kxn-rules (the rule engine) are pure logic and must stay
    # compilable to WebAssembly; kxn-wasm exposes them to JS via wasm-bindgen.
    # kxn-cli is excluded: cloud SDKs, DB drivers and ring have no wasm support.
    name: WASM build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check wasm target
        run: cargo check -p kxn-core -p kxn-rules -p kxn-wasm --target wasm32-unknown-unknown --locked

      - name: Install wasm-pack
        run: |
          gh release download v0.15.0 --repo rustwasm/wasm-pack \
            --pattern '*x86_64-unknown-linux-musl.tar.gz' --dir /tmp/wasm-pack-dl
          tar xzf /tmp/wasm-pack-dl/wasm-pack-*.tar.gz --strip-components=1 \
            -C "$HOME/.cargo/bin" --wildcards '*/wasm-pack'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Node.js package
        run: wasm-pack build crates/kxn-wasm --target nodejs --out-dir pkg-node --release

      - name: Smoke test (real scan in Node.js)
        run: node scripts/wasm-smoke-test.mjs

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071: rsa crate Marvin Attack — no upstream patch,
          # kxn only uses rsa for local SSH key parsing (not network-observable).
          # RUSTSEC-2026-0118 / RUSTSEC-2026-0119: hickory-proto 0.25.2 DoS,
          # transitive via reqwest. Awaiting upstream bump to hickory-proto 0.26.x.
          # RUSTSEC-2026-0153 / RUSTSEC-2026-0154: russh / russh-cryptovec,
          # transitive via async-ssh2-tokio 0.8. The fix is only in russh >=0.60.3,
          # which requires a major async-ssh2-tokio 0.8 -> 0.12 upgrade with SSH
          # provider changes — tracked as a follow-up. (The postgres-protocol /
          # tokio-postgres advisories RUSTSEC-2026-0178/0179/0180 are fixed by a
          # lockfile bump, not ignored.)
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0153,RUSTSEC-2026-0154
