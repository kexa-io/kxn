name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build and upload release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  build-docker:
    # Image multi-architecture : chaque architecture est construite sur son propre
    # runner natif (pas d'émulation QEMU, trop lente pour un build Rust), puis un
    # job assemble les deux images dans un seul manifest.
    name: Build and push Docker image (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_NAME }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME_KEXA }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD_KEXA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ secrets.DOCKER_REGISTRY_NAME }}/kexa/kxn:${{ needs.release-please.outputs.tag_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    name: Publish multi-arch Docker manifest
    needs: [release-please, build-docker]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_NAME }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME_KEXA }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD_KEXA }}

      - name: Create manifest (version and latest)
        env:
          REG: ${{ secrets.DOCKER_REGISTRY_NAME }}/kexa/kxn
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          docker buildx imagetools create -t "$REG:$TAG" "$REG:$TAG-amd64" "$REG:$TAG-arm64"
          docker buildx imagetools create -t "$REG:latest" "$REG:$TAG-amd64" "$REG:$TAG-arm64"
          docker buildx imagetools inspect "$REG:$TAG"

      - name: Get manifest digest
        id: digest
        env:
          REG: ${{ secrets.DOCKER_REGISTRY_NAME }}/kexa/kxn
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "digest=$(docker buildx imagetools inspect "$REG:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      # Signed build provenance for the multi-arch image. Verify with:
      #   gh attestation verify oci://docker.io/kexa/kxn:<tag> --repo kexa-io/kxn
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/kexa/kxn
          subject-digest: ${{ steps.digest.outputs.digest }}

  publish-helm-charts:
    # The charts as OCI artifacts next to the image, so installing one needs no
    # git clone:  helm install kxn-stack oci://registry-1.docker.io/kexa/kxn-stack --version <x.y.z>
    # Each chart is published under the release version (the `version` of its
    # Chart.yaml only versions the source tree) with appVersion = the tag.
    # Runs after the image manifest so a published chart never points to an
    # image that does not exist yet.
    name: Publish Helm charts
    needs: [release-please, docker-manifest]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME_KEXA }}
          PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD_KEXA }}
        run: echo "$PASSWORD" | helm registry login registry-1.docker.io --username "$USERNAME" --password-stdin

      - name: Package and push
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist
          for chart in kxn-monitor kxn-logs kxn-stack; do
            helm lint "deploy/helm/$chart"
            helm package "deploy/helm/$chart" --version "$VERSION" --app-version "$TAG" -d dist
            helm push "dist/$chart-$VERSION.tgz" oci://registry-1.docker.io/kexa
          done

  update-latest-tag:
    name: Update 'latest' tag
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest stable release (${{ needs.release-please.outputs.tag_name }})"
          git push origin latest --force
