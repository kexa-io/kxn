# Default values for kxn-logs.
# This chart deploys a single kxn pod that tails Kubernetes pod logs
# via the Kubernetes API and forwards filtered lines to a Loki sink.

image:
  repository: kexa/kxn
  tag: ""  # defaults to .Chart.appVersion when empty
  pullPolicy: IfNotPresent

# Override the chart's full name. By default templates derive it from
# the release name + chart name.
nameOverride: ""
fullnameOverride: ""

# Loki sink, written as a `[[save]] type = "loki"` block in the config.
# Accepted forms: host:port (plain HTTP), loki://host:port,
# loki+https://host, http(s)://host.
loki:
  enabled: true
  url: "loki.monitoring.svc.cluster.local:3100"
  # Optional basic-auth credentials for Loki, taken from a pre-existing
  # secret and exposed to kxn as LOKI_USER / LOKI_PASSWORD. Leave empty to
  # skip auth.
  authSecretName: ""
  authUsernameKey: "username"
  authPasswordKey: "password"
  # Value of the `origin` stream label. Streams are labelled
  # {app="kxn", kind="log", origin=<this>}; set it per cluster when several
  # clusters push to the same Loki.
  origin: "kxn-logs"

# Options passed to `kxn logs`.
collection:
  # Collection interval in seconds (how often kxn polls each pod).
  intervalSeconds: 60
  # Log levels kept (exact match, not a minimum). Empty = all levels.
  # Valid: error, warning, info
  levels:
    - error
  # Sources kept. Empty = all.
  sources: []
  # Optional regex the message must match. Empty = all.
  pattern: ""

# RBAC: kxn needs read access to pods (for log streaming) and to the
# namespaces it collects from. Keep this enabled unless you provide
# a pre-existing ServiceAccount with equivalent rights.
rbac:
  create: true

serviceAccount:
  create: true
  # If create is false, point at the pre-existing SA name to bind.
  name: ""
  annotations: {}

# Prometheus exposition. When enabled, the deployment also serves /metrics
# on this port (kxn_logs_*).
metrics:
  enabled: true
  port: 9090
  # ServiceMonitor for Prometheus Operator scraping. Set to true if you
  # run kube-prometheus-stack or similar.
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    labels: {}

# Pod-level config
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Skip TLS verification of the Kubernetes API (only set to true if your
# in-cluster cluster CA is not in the trust store, e.g. some managed
# Kubernetes flavors). Default false: kxn uses the SA token + CA bundle.
k8sInsecureTls: false

# Extra environment variables passed to the kxn container.
extraEnv: []
#  - name: KXN_LOG_FORMAT
#    value: json

# Extra command-line flags appended to `kxn logs`.
extraArgs: []
