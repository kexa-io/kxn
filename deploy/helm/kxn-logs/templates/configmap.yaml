apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kxn-logs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kxn-logs.labels" . | nindent 4 }}
data:
  kxn.toml: |
    # Centralized Kubernetes pod log collection with `kxn logs`.
    # The target, interval and filters are passed on the command line; this
    # file only declares where the kept lines are written.
    {{- if .Values.loki.enabled }}
    [[save]]
    type = "loki"
    url = "{{ include "kxn-logs.lokiUrl" . }}"
    origin = "{{ .Values.loki.origin }}"
    {{- end }}
