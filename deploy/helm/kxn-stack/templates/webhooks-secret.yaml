{{- /*
Auto-create the webhook secret expected by kxn-monitor. If no webhook URL is
provided, the key is still created (empty) so kxn-monitor's `secretKeyRef`
doesn't fail with CreateContainerConfigError; kxn-monitor passes --webhook only
when the value is set. The old placeholder URL made every alert fail and log
"webhook delivery failed" on each scan.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: kxn-stack-webhooks
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  discord: {{ .Values.webhooks.discord | default "" | quote }}
  slack:   {{ .Values.webhooks.slack   | default "" | quote }}
  teams:   {{ .Values.webhooks.teams   | default "" | quote }}
  generic: {{ .Values.webhooks.generic | default "" | quote }}
