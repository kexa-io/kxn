---
# Dedicated kxn namespace
apiVersion: v1
kind: Namespace
metadata:
  name: kxn

---
# ServiceAccount kxn runs as (in-cluster auth)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kxn
  namespace: kxn

---
# ClusterRole: read-only on every resource kxn needs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kxn-reader
rules:
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - namespaces
    - services
    - serviceaccounts
    - configmaps
    - events
    - persistentvolumes
    - persistentvolumeclaims
    - resourcequotas
    - limitranges
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kxn-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kxn-reader
subjects:
- kind: ServiceAccount
  name: kxn
  namespace: kxn

---
# The kxn-secrets Secret (key DISCORD_WEBHOOK) is left out of this manifest on
# purpose, so applying it never overwrites the real value. Create it first:
#   kubectl create namespace kxn
#   kubectl create secret generic kxn-secrets -n kxn \
#     --from-literal=DISCORD_WEBHOOK='https://discord.com/api/webhooks/...'

---
# ConfigMap: kxn configuration and monitoring rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: kxn-config
  namespace: kxn
data:
  kxn.toml: |
    [rules]
    mandatory = [
      { name = "pods-not-running", path = "/etc/kxn/rules/pods-not-running.toml" },
      { name = "node-resources", path = "/etc/kxn/rules/node-resources.toml" }
    ]

    [[targets]]
    name = "ovh-cluster"
    provider = "kubernetes"
    uri = "kubernetes://in-cluster"
    interval = 120

  pods-not-running.toml: |
    [metadata]
    version = "1.0.0"
    provider = "kubernetes"
    description = "Alert on pods in an abnormal phase"

    # The pod phase must not be Failed (Failed → level 3 violation)
    [[rules]]
    name = "pod-not-failed"
    description = "Pod in Failed phase — needs immediate action"
    level = 3
    object = "pods"

      [[rules.conditions]]
      property = "phase"
      condition = "DIFFERENT"
      value = "Failed"

    # The pod phase must not be Unknown (Unknown → level 3 violation)
    [[rules]]
    name = "pod-not-unknown"
    description = "Pod in Unknown phase — node unreachable or pod lost"
    level = 3
    object = "pods"

      [[rules.conditions]]
      property = "phase"
      condition = "DIFFERENT"
      value = "Unknown"

    # The pod phase must not be Pending (Pending → level 1 violation)
    [[rules]]
    name = "pod-not-pending"
    description = "Pod stuck in Pending (cannot be scheduled or not enough resources)"
    level = 1
    object = "pods"

      [[rules.conditions]]
      property = "phase"
      condition = "DIFFERENT"
      value = "Pending"

  node-resources.toml: |
    [metadata]
    version = "1.0.0"
    provider = "kubernetes"
    description = "Alert on node CPU and memory usage"

    # Node CPU > 90% (1840m allocatable → threshold 1656m)
    [[rules]]
    name = "node-high-cpu"
    description = "Node CPU > 90% — throttling risk"
    level = 2
    object = "node_metrics"

      [[rules.conditions]]
      property = "cpu_millicores"
      condition = "INF"
      value = 1656

    # Node memory > 85% (~5908 MiB allocatable → threshold 5022 MiB)
    [[rules]]
    name = "node-high-memory"
    description = "Node memory > 85% — OOM kill risk"
    level = 2
    object = "node_metrics"

      [[rules.conditions]]
      property = "memory_mib"
      condition = "INF"
      value = 5022

---
# kxn watch Deployment — one replica is enough
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kxn-monitor
  namespace: kxn
  labels:
    app: kxn-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kxn-monitor
  template:
    metadata:
      labels:
        app: kxn-monitor
    spec:
      serviceAccountName: kxn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: kxn
        image: kexa/kxn:v0.64.0 # x-release-please-version
        imagePullPolicy: Always
        command: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
        args:
        - >-
          exec /usr/local/bin/kxn watch
          --config /etc/kxn/kxn.toml
          --webhook "$DISCORD_WEBHOOK"
        env:
        - name: DISCORD_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: kxn-secrets
              key: DISCORD_WEBHOOK
        - name: K8S_INSECURE
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /etc/kxn/kxn.toml
          subPath: kxn.toml
          readOnly: true
        - name: config
          mountPath: /etc/kxn/rules/pods-not-running.toml
          subPath: pods-not-running.toml
          readOnly: true
        - name: config
          mountPath: /etc/kxn/rules/node-resources.toml
          subPath: node-resources.toml
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: kxn-config
          items:
          - key: kxn.toml
            path: kxn.toml
          - key: pods-not-running.toml
            path: pods-not-running.toml
          - key: node-resources.toml
            path: node-resources.toml
