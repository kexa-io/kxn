[metadata]
version = "1.0.0"
provider = "microsoft.graph"
description = "Azure Service Principal secret expiration checks"
tags = ["azure", "security", "sp", "rotation"]

[[rules]]
name = "sp-secret-expired"
description = "Service principal secret is expired — rotate immediately"
level = 3
object = "service_principals"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "days_until_expiry", condition = "SUP", value = "0" },
  ]

[[rules.compliance]]
framework = "NIS2"
control = "21.2.h"
section = "Cryptography"

[[rules.compliance]]
framework = "SOC2"
control = "CC6.1"
section = "Logical access security and encryption"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.a"
section = "Pseudonymisation and encryption of personal data"

[[rules]]
name = "sp-secret-expiring-7d"
description = "Service principal secret expires in less than 7 days — rotate now"
level = 3
object = "service_principals"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "days_until_expiry", condition = "SUP", value = "7" },
  ]

[[rules.compliance]]
framework = "NIS2"
control = "21.2.h"
section = "Cryptography"

[[rules.compliance]]
framework = "SOC2"
control = "CC6.1"
section = "Logical access security and encryption"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.a"
section = "Pseudonymisation and encryption of personal data"

[[rules]]
name = "sp-secret-expiring-30d"
description = "Service principal secret expires in less than 30 days — plan rotation"
level = 2
object = "service_principals"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "days_until_expiry", condition = "SUP", value = "30" },
  ]

[[rules.compliance]]
framework = "NIS2"
control = "21.2.h"
section = "Cryptography"

[[rules.compliance]]
framework = "SOC2"
control = "CC6.1"
section = "Logical access security and encryption"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.a"
section = "Pseudonymisation and encryption of personal data"
