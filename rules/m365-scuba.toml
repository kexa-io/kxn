[metadata]
version = "1.0.0"
provider = "m365"
description = "CISA SCuBA Secure Configuration Baselines for Microsoft 365 (ScubaGear v2.0.0)"
tags = ["scuba", "cisa", "bod-25-01", "m365", "microsoft365"]

# One rule per SCuBA policy, named after its ID; the description is the policy
# statement. Target: m365:// (same application as m365-cis.toml).
#
# Covered: 65 of the 109 policies. Not covered, because they need
# an API this provider does not reach (Power BI / Fabric and Power Platform
# admin APIs, Security & Compliance for DLP and alert policies, the SharePoint
# admin API for OneDrive and link settings, Teams app-centric management),
# a license this check cannot assume (PIM alerts), or are manual in SCuBA:
#   MS.AAD.2.2v1 MS.AAD.4.1v1 MS.AAD.7.5v1 MS.AAD.7.7v1 MS.AAD.7.8v1
#   MS.AAD.7.9v1 MS.AAD.8.3v1 MS.AAD.9.1v1 MS.EXO.4.3v1 MS.POWERBI.1.1v1
#   MS.POWERBI.2.1v1 MS.POWERBI.3.1v1 MS.POWERBI.4.1v1 MS.POWERBI.4.2v1
#   MS.POWERBI.5.1v1 MS.POWERBI.6.1v1 MS.POWERBI.7.1v1 MS.POWERPLATFORM.1.1v1
#   MS.POWERPLATFORM.1.2v1 MS.POWERPLATFORM.2.1v1 MS.POWERPLATFORM.2.2v1
#   MS.POWERPLATFORM.3.1v1 MS.POWERPLATFORM.3.2v1 MS.POWERPLATFORM.4.1v1
#   MS.POWERPLATFORM.5.1v1 MS.POWERPLATFORM.6.1v1 MS.SECURITYSUITE.1.3v1
#   MS.SECURITYSUITE.3.1v1 MS.SECURITYSUITE.3.2v1 MS.SECURITYSUITE.3.3v1
#   MS.SECURITYSUITE.3.4v1 MS.SECURITYSUITE.3.5v1 MS.SECURITYSUITE.4.1v1
#   MS.SECURITYSUITE.4.2v1 MS.SECURITYSUITE.5.2v1 MS.SHAREPOINT.1.2v1
#   MS.SHAREPOINT.2.1v1 MS.SHAREPOINT.2.2v1 MS.SHAREPOINT.3.1v1
#   MS.SHAREPOINT.3.2v1 MS.SHAREPOINT.3.3v2 MS.TEAMS.5.1v2 MS.TEAMS.5.2v2
#   MS.TEAMS.5.3v2
# MS.EXO.4.3 (reports to reports@dmarc.cyber.dhs.gov) concerns U.S. federal agencies only.


[[rules]]
name = "scuba-aad-1.1v1-legacy-auth-blocked"
description = "MS.AAD.1.1v1 - Legacy authentication SHALL be blocked."
level = 3
object = "tenant"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "MS.AAD.1.1v1"
  section = "Microsoft Entra ID"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "ca_block_legacy_auth"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


