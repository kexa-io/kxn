[[rules]]
name = "scuba-aad-3.3v2-authenticator-login-context"
description = "MS.AAD.3.3v2 - If Microsoft Authenticator is enabled, it SHALL be configured to show login context information."
level = 2
object = "authentication_methods_policy"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "MS.AAD.3.3v2"
  section = "Microsoft Entra ID"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "OR"
  criteria = [
    { property = "methods.MicrosoftAuthenticator.state", condition = "EQUAL", value = "disabled" },
    { operator = "AND", criteria = [{ property = "methods.MicrosoftAuthenticator.featureSettings.displayAppInformationRequiredState.state", condition = "EQUAL", value = "enabled" }, { property = "methods.MicrosoftAuthenticator.featureSettings.displayLocationInformationRequiredState.state", condition = "EQUAL", value = "enabled" }] },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


