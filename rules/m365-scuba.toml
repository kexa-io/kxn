[[rules]]
name = "scuba-aad-3.1v1-phishing-resistant-mfa-all-users"
description = "MS.AAD.3.1v1 - Phishing-resistant MFA SHALL be enforced for all users. The phishing-resistant methods of Microsoft Entra ID certificate-based authentication (CBA), FIDO2 Security Key, Windows Hello for Business, and device-bound passkeys (in the authenticator application of choice) are the recommended authentication options since they offer forms of MFA with the fewest weaknesses. For federal agencies, Microsoft Entra ID CBA supports federal PIV card authentication directly to Microsoft Entra ID. If on-premises PIV authentication and federation to Microsoft Entra ID is used, [enforce PIV logon via the Microsoft Active Directory group policy](https://www.idmanagement.gov/implement/scl-windows/)."
level = 3
object = "tenant"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "MS.AAD.3.1v1"
  section = "Microsoft Entra ID"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "scuba_phishing_resistant_mfa_all_users"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


