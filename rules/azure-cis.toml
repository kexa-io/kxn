[[rules]]
name = "azure-cis-5.7-two-to-three-owners"
description = "CIS 5.7 - Ensure there are between 2 and 3 subscription owners"
level = 2
object = "subscription"

  [[rules.compliance]]
  framework = "CIS"
  control = "5.7"
  section = "Identity Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "owners", condition = "SUP_OR_EQUAL", value = 2 },
    { property = "owners", condition = "INF_OR_EQUAL", value = 3 },
  ]


