  framework = "CIS"
  control = "6.1.1.1"
  section = "Management and Governance Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.10"
  section = "Detection"

  [[rules.conditions]]
  property = "activity_log_exported"
  condition = "EQUAL"
  value = true


[[rules]]
name = "azure-cis-6.1.1.2-activity-log-categories"
description = "CIS 6.1.1.2 - Ensure the diagnostic setting captures appropriate categories (Administrative, Alert, Policy, Security)"
level = 2
object = "subscription"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.1.1.2"
  section = "Management and Governance Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.10"
  section = "Detection"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "activity_log_categories", condition = "INCLUDE", value = "Administrative" },
    { property = "activity_log_categories", condition = "INCLUDE", value = "Alert" },
    { property = "activity_log_categories", condition = "INCLUDE", value = "Policy" },
    { property = "activity_log_categories", condition = "INCLUDE", value = "Security" },
  ]


