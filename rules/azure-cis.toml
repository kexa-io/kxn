[metadata]
version = "6.0.0"
provider = "azure"
description = "CIS Microsoft Azure Foundations Benchmark v6.0.0"
tags = ["cis", "azure", "security", "compliance"]

# Rule names carry the official v6.0.0 control numbers. The Entra ID controls
# that Microsoft Graph answers (5.1.1, 5.1.3) are in azure-cis-entra.toml.
#
# Objects named `microsoft.*/…` are Azure Resource Graph types: the resource
# as ARM returns it (`properties.…`).
#
# Not here, because no API answers them or they are an organizational process
# the benchmark itself marks manual:
#   2.1.2     NSGs on Databricks subnets (needs the workspace's subnets resolved)
#   2.1.3-6, 2.1.12  Databricks cluster encryption, SCIM sync, Unity Catalog,
#             personal access tokens, group reviews (Databricks workspace APIs)
#   2.1.7     Databricks diagnostic log delivery
#   3.1.1, 5.1.2, 5.1.4, 5.3.1, 5.3.2, 5.3.4-5.3.7, 5.5, 5.6  identity reviews
#   6.1.1.7-6.1.1.9  Entra and Intune diagnostic settings (tenant scope)
#   6.1.4, 6.1.5, 6.2, 7.7, 7.16, 9.3.9, 9.3.10  reviews, SKUs, locks, perimeters
#   8.1.3.2, 8.1.10, 8.1.16, 8.2.1  VA provider, system updates, EASM, IoT
#   8.1.5.2   monitoring of storage threat alerts
#   8.3.10, 8.3.11  Managed HSM, certificate validity (Key Vault data plane)


[[rules]]
name = "azure-cis-2.1.1-databricks-vnet-injection"
description = "CIS 2.1.1 - Ensure that Azure Databricks is deployed in a customer-managed virtual network (VNet)"
level = 2
object = "microsoft.databricks/workspaces"

  [[rules.compliance]]
  framework = "CIS"
  control = "2.1.1"
  section = "Analytics Services"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.4"
  section = "Protection - network security"

  [[rules.conditions]]
  property = "properties.parameters.customVirtualNetworkId.value"
  condition = "DIFFERENT"
  value = ""


[[rules]]
name = "azure-cis-2.1.8-databricks-cmk"
description = "CIS 2.1.8 - Ensure critical data in Azure Databricks is encrypted with customer-managed keys (CMK)"
level = 1
object = "microsoft.databricks/workspaces"

  [[rules.compliance]]
  framework = "CIS"
  control = "2.1.8"
  section = "Analytics Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "properties.encryption.entities.managedServices.keySource"
  condition = "EQUAL"
  value = "Microsoft.Keyvault"


