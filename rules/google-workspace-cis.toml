[metadata]
version = "2.0.0"
provider = "googleworkspace"
description = "CIS Google Workspace Foundations Benchmark v1.4.0"
tags = ["cis", "google-workspace", "gsuite", "security"]

# Rule names carry the official v1.4.0 control numbers. Target:
# googleworkspace://<domain>. Settings are read through the Cloud Identity
# Policy API (scope cloud-identity.policies.readonly) and evaluated per
# organizational unit: `settings` has one row per OU, the values in force.
#
# Covered: 63 of the 86 controls (the benchmark marks them all manual,
# as they were Admin console checks). Not covered here, because no read API
# exposes them or they are review processes:
#   1.2.1.1             external directory sharing
#   3.1.1.1.2, 3.1.1.2.2, 3.1.1.3.1  internal calendar sharing, Calendar offline
#   3.1.2.2.1           Drive offline (device policy)
#   3.1.3.3.1, 3.1.3.5.1, 3.1.3.5.3, 3.1.3.6.2, 3.1.3.7.1, 3.1.3.7.2
#                       quarantines, POP/IMAP, per-user gateways, spam bypass,
#                       comprehensive storage, TLS compliance: the Policy API
#                       omits them and Google documents no default
#   4.1.1.2             security keys for admins (group-scoped policy)
#   4.1.4.1, 4.2.1.1, 4.2.2.1, 4.2.3.1, 4.2.5.1  login challenges, Google
#                       services access, context-aware access, DLP rules,
#                       Google Cloud session control
#   4.2.1.2, 4.2.1.4, 4.3.x, 5.1.1.x  periodic reviews
# A sub-OU row is its own policies over the root's; group-scoped policies are
# listed in the `policies` object, not folded into the OU rows.


[[rules]]
name = "gws-cis-1.1.1-two-to-four-super-admins"
description = "CIS 1.1.1 - Ensure that between two and four super admins are designated"
level = 2
object = "customer"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1.1"
  section = "Directory"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "super_admins", condition = "SUP_OR_EQUAL", value = 2 },
    { property = "super_admins", condition = "INF_OR_EQUAL", value = 4 },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "gws-cis-1.1.2-super-admins-only-super-admin"
description = "CIS 1.1.2 - Ensure super admin accounts are used only for super admin activities (no delegated admin role)"
level = 1
object = "users"
apply_to = "is_admin=true"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1.2"
  section = "Directory"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "is_delegated_admin"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


