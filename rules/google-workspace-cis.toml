[[rules]]
name = "gws-cis-4.1.5.1-strong-password-policy"
description = "CIS 4.1.5.1 - Ensure password policy is configured for enhanced security (strong, 14+, enforced at login, no reuse, 365-day reset)"
level = 1
object = "settings"

  [[rules.compliance]]
  framework = "CIS"
  control = "4.1.5.1"
  section = "Security"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "security.password.allowedStrength", condition = "EQUAL", value = "STRONG" },
    { property = "security.password.minimumLength", condition = "SUP_OR_EQUAL", value = 14 },
    { property = "security.password.enforceRequirementsAtLogin", condition = "EQUAL", value = true },
    { property = "security.password.allowReuse", condition = "EQUAL", value = false },
    { property = "security.password.expirationDurationSeconds", condition = "SUP", value = 0 },
    { property = "security.password.expirationDurationSeconds", condition = "INF_OR_EQUAL", value = 31536000 },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


