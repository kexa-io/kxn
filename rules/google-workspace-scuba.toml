[[rules]]
name = "scuba-gws-commoncontrols-4.1v1-reauth-12-hours"
description = "GWS.COMMONCONTROLS.4.1v1 - Users SHALL be forced to re-authenticate after an established 12-hour GWS login session has expired."
level = 2
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.COMMONCONTROLS.4.1v1"
  section = "Common Controls"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
