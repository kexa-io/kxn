[[rules]]
name = "scuba-gws-commoncontrols-1.1v1-phishing-resistant-mfa"
description = "GWS.COMMONCONTROLS.1.1v1 - Phishing-Resistant MFA SHALL be required for all users."
level = 3
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.COMMONCONTROLS.1.1v1"
  section = "Common Controls"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "security.two_step_verification_enforcement.enforcedFrom", condition = "DIFFERENT", value = "" },
    { property = "security.two_step_verification_enforcement.enforcedFrom", condition = "DATE_SUP", value = "0 0 0 0" },
    { property = "security.two_step_verification_enforcement_factor.allowedSignInFactorSet", condition = "EQUAL", value = "PASSKEY_ONLY" },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "scuba-gws-commoncontrols-1.2v1-mfa-enforced"
description = "GWS.COMMONCONTROLS.1.2v1 - If phishing-resistant MFA has not been enforced, an alternative MFA method SHALL be enforced for all users."
level = 3
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.COMMONCONTROLS.1.2v1"
  section = "Common Controls"

  [[rules.compliance]]
