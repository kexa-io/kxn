[metadata]
version = "1.0.0"
provider = "googleworkspace"
description = "CISA SCuBA Secure Configuration Baselines for Google Workspace (ScubaGoggles v1.1.0)"
tags = ["scuba", "cisa", "bod-25-01", "google-workspace"]

# One rule per SCuBA policy, named after its ID; the description is the policy
# statement. Settings come from the Cloud Identity Policy API (`settings`, one
# row per OU), as ScubaGoggles reads them; expected values follow its Rego.
#
# Covered: 92 of the 138 policies. Not covered: settings the Policy API
# omits without a documented default, checks ScubaGoggles reads from the admin
# audit log rather than the policy API, region (U.S.-only) and manual items:
#   GWS.ASSUREDCONTROLS.1.1v1 GWS.ASSUREDCONTROLS.1.2v1 GWS.CALENDAR.3.1v1
#   GWS.CALENDAR.3.2v1 GWS.CHAT.1.1v1 GWS.CHAT.1.2v1 GWS.CHAT.5.1v1
#   GWS.CHAT.5.2v1 GWS.COMMONCONTROLS.10.1v1 GWS.COMMONCONTROLS.10.2v1
#   GWS.COMMONCONTROLS.14.1v1 GWS.COMMONCONTROLS.14.2v1
#   GWS.COMMONCONTROLS.15.1v1 GWS.COMMONCONTROLS.16.1v1
#   GWS.COMMONCONTROLS.16.3v1 GWS.COMMONCONTROLS.16.4v1
#   GWS.COMMONCONTROLS.17.1v1 GWS.COMMONCONTROLS.18.1v1
#   GWS.COMMONCONTROLS.18.2v1 GWS.COMMONCONTROLS.2.1v1
#   GWS.COMMONCONTROLS.3.1v1 GWS.COMMONCONTROLS.3.2v1 GWS.COMMONCONTROLS.6.1v1
#   GWS.COMMONCONTROLS.7.1v1 GWS.COMMONCONTROLS.8.3v1 GWS.COMMONCONTROLS.9.1v1
#   GWS.COMMONCONTROLS.9.2v1 GWS.DRIVEDOCS.1.10v1 GWS.DRIVEDOCS.1.11v1
#   GWS.DRIVEDOCS.1.7v1 GWS.DRIVEDOCS.1.8v1 GWS.DRIVEDOCS.5.2v1
#   GWS.GEMINI.3.2v1 GWS.GMAIL.10.1v1 GWS.GMAIL.12.1v1 GWS.GMAIL.16.1v1
#   GWS.GMAIL.17.1v1 GWS.GMAIL.18.1v1 GWS.GMAIL.18.2v1 GWS.GMAIL.18.3v1
#   GWS.GMAIL.4.3v1 GWS.GMAIL.4.4v1 GWS.GMAIL.9.1v1 GWS.MEET.6.1v1
#   GWS.MEET.6.2v1 GWS.MEET.6.3v1


[[rules]]
name = "scuba-gws-assuredcontrols-2.1v1-processing-in-storage-region"
description = "GWS.ASSUREDCONTROLS.2.1v1 - Data processing across multiple regions SHOULD be disabled for all Google Workspace products."
level = 1
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.ASSUREDCONTROLS.2.1v1"
  section = "Assured Controls"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.12"
  section = "Backup policies and recovery"

  [[rules.conditions]]
  property = "data_regions.data_processing_region.limitToStorageRegion"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.e"
  section = "Security in acquisition, development and maintenance"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.1"
  section = "Detection of configuration changes and vulnerabilities"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "scuba-gws-calendar-1.1v1-primary-external-free-busy"
description = "GWS.CALENDAR.1.1v1 - External sharing options for primary calendars SHALL be configured to \"Only free/busy information (hide event details).\""
level = 2
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.CALENDAR.1.1v1"
  section = "Calendar"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "calendar.primary_calendar_max_allowed_external_sharing.maxAllowedExternalSharing"
  condition = "EQUAL"
  value = "EXTERNAL_FREE_BUSY_ONLY"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.6"
  section = "Protection against threats from outside system boundaries"

  [[rules.compliance]]
  framework = "GDPR"
  control = "25"
  section = "Data protection by design and by default"


