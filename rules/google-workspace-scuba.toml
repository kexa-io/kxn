[[rules]]
name = "scuba-gws-chat-4.1v1-external-chat-allowlisted"
description = "GWS.CHAT.4.1v1 - External chat messaging SHALL be restricted to allowlisted domains only."
level = 2
object = "settings"

  [[rules.compliance]]
  framework = "CISA-SCuBA"
  control = "GWS.CHAT.4.1v1"
  section = "Chat"

  [[rules.compliance]]
  framework = "NIS2"
