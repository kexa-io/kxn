    { property = "classroom.teacher_permissions.whoCanCreateClasses", condition = "DIFFERENT", value = "" },
    { property = "classroom.teacher_permissions.whoCanCreateClasses", condition = "NOT_IN", value = ["ALL_PENDING_AND_VERIFIED_TEACHERS", "ANYONE_IN_DOMAIN"] },
