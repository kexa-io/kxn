  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "OR"
  criteria = [
    { property = "chat.external_chat_restriction.allowExternalChat", condition = "EQUAL", value = false },
    { operator = "AND", criteria = [{ property = "chat.external_chat_restriction.externalChatRestriction", condition = "DIFFERENT", value = "" }, { property = "chat.external_chat_restriction.externalChatRestriction", condition = "NOT_IN", value = ["NO_RESTRICTION"] }] },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.6"
  section = "Protection against threats from outside system boundaries"

  [[rules.compliance]]
  framework = "GDPR"
  control = "25"
  section = "Data protection by design and by default"


