[metadata]
version = "1.1.0"
provider = "postgresql"
description = "CIS PostgreSQL 17 Benchmark v1.1.0"
tags = ["cis", "postgresql", "database", "security"]

# CIS PostgreSQL 17 Benchmark v1.1.0, read through a database connection.
# Run it as a superuser (or pg_read_all_settings + pg_read_server_files) so
# pg_hba_file_rules and pg_authid can be read; without them 5.3, 5.4 and 4.10
# are not evaluated.
#
# Not automated here:
#   1.1-1.4, 1.6, 1.7, 2.x, 4.1, 4.2, 5.1, 6.7, 8.2: host-side.
#   3.1.10, 4.4, 4.6, 4.7, 4.9, 5.6 (policy content), 6.1, 6.3-6.6, 7.1, 7.3,
#   7.5, 8.1, 8.3: reviews.
# 4.3 and 5.5 are reviews: they list the roles to look at.
# Syslog controls (3.1.11-3.1.13) matter only when log_destination includes
# syslog.

[[rules]]
name = "pg-cis-1.5-supported-version"
description = "CIS 1.5 - Ensure the Latest Security Patches are Applied (a supported major release, 14 or later; minor version reviewed)"
level = 1
object = "settings"

  [[rules.conditions]]
  property = "server_version_num"
  condition = "SUP_OR_EQUAL"
  value = 140000

  [[rules.compliance]]
  framework = "CIS"
  control = "1.5"
  section = "Installation and Patches"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.e"
  section = "Security in acquisition, development and maintenance"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.1"
  section = "Detection of configuration changes and vulnerabilities"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "pg-cis-3.1.2-log-destination"
description = "CIS 3.1.2 - Ensure the log destinations are set correctly (log_destination set)"
level = 1
object = "settings"

  [[rules.conditions]]
  property = "log_destination"
  condition = "DIFFERENT"
  value = ""

  [[rules.compliance]]
  framework = "CIS"
  control = "3.1.2"
  section = "Logging Monitoring and Auditing"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.2"
  section = "Monitoring of system components for anomalies"

  [[rules.compliance]]
  framework = "GDPR"
  control = "33"
  section = "Notification of a personal data breach (detection)"


