[metadata]
version = "1.0.0"
provider = "gcp"
description = "GCP Secret Manager rotation checks"
tags = ["gcp", "security", "secret-manager", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Pattern:
#   - flag ENABLED versions older than 90 days
#   - flag secrets with no rotation policy attached
#
# Objects from the native gcp:// provider: `secret_versions` (one row per
# version, with `state` and `create_time`) and `secrets` (the Secret Manager
# resource as the API returns it; `rotation.rotationPeriod` is set only when a
# rotation schedule is configured).

[[rules]]
name = "gcp-secret-version-older-than-90-days"
description = "Enabled secret version is older than 90 days — rotate"
level = 2
object = "secret_versions"
tags = ["gcp", "rotation", "secret-manager"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  operator = "OR"
  criteria = [
    { property = "state", condition = "DIFFERENT", value = "ENABLED" },
    { property = "create_time", condition = "DATE_INF", value = "0 0 0 90" },
  ]

[[rules]]
name = "gcp-secret-version-older-than-180-days"
description = "Enabled secret version is older than 180 days — overdue rotation"
level = 4
object = "secret_versions"
tags = ["gcp", "rotation", "secret-manager", "overdue"]

  [[rules.conditions]]
  operator = "OR"
  criteria = [
    { property = "state", condition = "DIFFERENT", value = "ENABLED" },
    { property = "create_time", condition = "DATE_INF", value = "0 0 0 180" },
  ]

[[rules]]
name = "gcp-secret-without-rotation-policy"
description = "Secret has no rotation policy configured — cannot prove rotation cadence"
level = 3
object = "secrets"
tags = ["gcp", "rotation", "secret-manager", "policy"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  property = "rotation.rotationPeriod"
  condition = "DIFFERENT"
  value = ""


