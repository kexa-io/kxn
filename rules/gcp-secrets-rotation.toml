[metadata]
version = "1.0.0"
provider = "hashicorp/google"
description = "GCP Secret Manager rotation checks"
tags = ["gcp", "security", "secret-manager", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Pattern:
#   - flag ENABLED versions older than 90 days
#   - flag secrets with no rotation policy attached
#
# Property names assume the Terraform google_secret_manager_secret(_version)
# data source schema. `create_time` and `state` come from the secret version;
# `rotation` is the secret-level block.

[[rules]]
name = "gcp-secret-version-older-than-90-days"
description = "Enabled secret version is older than 90 days — rotate"
level = 2
object = "google_secret_manager_secret_version"
tags = ["gcp", "rotation", "secret-manager"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "state", condition = "EQUAL", value = "ENABLED" },
    { property = "create_time", condition = "DATE_SUP", value = "0 0 0 90" },
  ]

[[rules]]
name = "gcp-secret-version-older-than-180-days"
description = "Enabled secret version is older than 180 days — overdue rotation"
level = 4
object = "google_secret_manager_secret_version"
tags = ["gcp", "rotation", "secret-manager", "overdue"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "state", condition = "EQUAL", value = "ENABLED" },
    { property = "create_time", condition = "DATE_SUP", value = "0 0 0 180" },
  ]

[[rules]]
name = "gcp-secret-without-rotation-policy"
description = "Secret has no rotation policy configured — cannot prove rotation cadence"
level = 3
object = "google_secret_manager_secret"
tags = ["gcp", "rotation", "secret-manager", "policy"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "rotation.rotation_period", condition = "EQUAL", value = "" },
  ]
