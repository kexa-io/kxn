[metadata]
version = "2.0.0"
provider = "mongodb"
description = "CIS MongoDB 7 and 8 Benchmark v2.0.0"
tags = ["cis", "mongodb", "database", "security"]

# CIS MongoDB 7 Benchmark v2.0.0 (the MongoDB 8 v2.0.0 benchmark has the same
# controls). Read through getCmdLineOpts, getParameter, buildInfo and usersInfo.
#
# Not automated here:
#   3.3 dedicated service account and 6.2 OS resource limits: host-side checks.
#   3.4 custom roles grant only what is needed: a review of each role.
#   7.1 key file and 7.2 database file permissions: the paths are in
#       cmdLineOpts (security_keyFile, storage_dbPath); the modes need the host.
# 5.4 applies only when the server logs to a file.

[[rules]]
name = "mongodb-cis-1.1-supported-version"
description = "CIS 1.1 - Ensure the appropriate MongoDB software version/patches are installed (7.0 or later; patch level is reviewed against the latest release)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "version_major"
  condition = "SUP_OR_EQUAL"
  value = 7

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1"
  section = "Installation and Patching"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.e"
  section = "Security in acquisition, development and maintenance"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.1"
  section = "Detection of configuration changes and vulnerabilities"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-2.1-authentication"
description = "CIS 2.1 - Ensure Authentication is configured (security.authorization: enabled)"
level = 3
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "security_authorization"
  condition = "EQUAL"
  value = "enabled"

  [[rules.compliance]]
  framework = "CIS"
  control = "2.1"
  section = "Authentication"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-2.2-no-localhost-bypass"
description = "CIS 2.2 - Ensure that MongoDB does not bypass authentication via the localhost exception (enableLocalhostAuthBypass: false)"
level = 2
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "enableLocalhostAuthBypass"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "CIS"
  control = "2.2"
  section = "Authentication"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-2.3-sharded-cluster-auth"
description = "CIS 2.3 - Ensure authentication is enabled in the sharded cluster (clusterAuthMode x509 with TLS certificate and CA files)"
level = 2
object = "cmdLineOpts"
apply_to = "in_sharded_cluster=true"

  [[rules.conditions]]
  property = "security_clusterAuthMode"
  condition = "EQUAL"
  value = "x509"

  [[rules.conditions]]
  property = "net_tls_certificateKeyFile"
  condition = "DIFFERENT"
  value = ""

  [[rules.conditions]]
  property = "net_tls_CAFile"
  condition = "DIFFERENT"
  value = ""

  [[rules.compliance]]
  framework = "CIS"
  control = "2.3"
  section = "Authentication"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.7"
  section = "Protection of data in transmission"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-3.1-least-privilege-accounts"
description = "CIS 3.1 - Ensure least privilege for database accounts: review accounts holding dbOwner, userAdmin, userAdminAnyDatabase or root on admin"
level = 1
object = "users"

  [[rules.conditions]]
  property = "holds_user_admin"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "CIS"
  control = "3.1"
  section = "Authorization"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-3.2-rbac-roles-assigned"
description = "CIS 3.2 - Ensure that role-based access control is enabled and configured appropriately: every account has at least one role"
level = 1
object = "users"

  [[rules.conditions]]
  property = "role_count"
  condition = "SUP"
  value = 0

  [[rules.compliance]]
  framework = "CIS"
  control = "3.2"
  section = "Authorization"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-3.5-review-superuser-roles"
description = "CIS 3.5 - Review Superuser/Admin Roles: accounts holding root, cluster-wide or any-database admin roles"
level = 0
object = "users"

  [[rules.conditions]]
  property = "is_privileged"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "CIS"
  control = "3.5"
  section = "Authorization"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "mongodb-cis-4.1-legacy-tls-disabled"
description = "CIS 4.1 - Ensure legacy TLS protocols are disabled (net.tls.disabledProtocols includes TLS1_0 and TLS1_1)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "net_tls_disabledProtocols"
  condition = "INCLUDE"
  value = "TLS1_0"

  [[rules.conditions]]
  property = "net_tls_disabledProtocols"
  condition = "INCLUDE"
  value = "TLS1_1"

  [[rules.compliance]]
  framework = "CIS"
  control = "4.1"
  section = "Data Encryption"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.7"
  section = "Protection of data in transmission"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-4.2-weak-protocols-disabled"
description = "CIS 4.2 - Ensure Weak Protocols are Disabled (TLS 1.0 and 1.1)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "net_tls_disabledProtocols"
  condition = "INCLUDE"
  value = "TLS1_0"

  [[rules.conditions]]
  property = "net_tls_disabledProtocols"
  condition = "INCLUDE"
  value = "TLS1_1"

  [[rules.compliance]]
  framework = "CIS"
  control = "4.2"
  section = "Data Encryption"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.7"
  section = "Protection of data in transmission"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-4.3-tls-required"
description = "CIS 4.3 - Ensure Encryption of Data in Transit (net.tls.mode: requireTLS)"
level = 2
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "net_tls_mode"
  condition = "EQUAL"
  value = "requireTLS"

  [[rules.compliance]]
  framework = "CIS"
  control = "4.3"
  section = "Data Encryption"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.7"
  section = "Protection of data in transmission"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-4.4-fips-mode"
description = "CIS 4.4 - Ensure Federal Information Processing Standard (FIPS) is enabled (MongoDB Enterprise)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "net_tls_FIPSMode"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "CIS"
  control = "4.4"
  section = "Data Encryption"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.7"
  section = "Protection of data in transmission"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-4.5-encryption-at-rest"
description = "CIS 4.5 - Ensure Encryption of Data at Rest (security.enableEncryption, MongoDB Enterprise)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "security_enableEncryption"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "CIS"
  control = "4.5"
  section = "Data Encryption"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


[[rules]]
name = "mongodb-cis-5.1-audit-enabled"
description = "CIS 5.1 - Ensure that system activity is audited (auditLog.destination set, MongoDB Enterprise or Percona)"
level = 2
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "auditLog_destination"
  condition = "DIFFERENT"
  value = ""

  [[rules.compliance]]
  framework = "CIS"
  control = "5.1"
  section = "Audit Logging"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.2"
  section = "Monitoring of system components for anomalies"

  [[rules.compliance]]
  framework = "GDPR"
  control = "33"
  section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongodb-cis-5.2-audit-filter"
description = "CIS 5.2 - Ensure that audit filters are configured properly (auditLog.filter set; review it)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "auditLog_filter"
  condition = "DIFFERENT"
  value = ""

  [[rules.compliance]]
  framework = "CIS"
  control = "5.2"
  section = "Audit Logging"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.2"
  section = "Monitoring of system components for anomalies"

  [[rules.compliance]]
  framework = "GDPR"
  control = "33"
  section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongodb-cis-5.3-log-not-quiet"
description = "CIS 5.3 - Ensure that logging captures as much information as possible (systemLog.quiet: false)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "systemLog_quiet"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "CIS"
  control = "5.3"
  section = "Audit Logging"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.2"
  section = "Monitoring of system components for anomalies"

  [[rules.compliance]]
  framework = "GDPR"
  control = "33"
  section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongodb-cis-5.4-log-append"
description = "CIS 5.4 - Ensure that new entries are appended to the end of the log file (systemLog.logAppend: true)"
level = 1
object = "cmdLineOpts"
apply_to = "systemLog_destination=file"

  [[rules.conditions]]
  property = "systemLog_logAppend"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "CIS"
  control = "5.4"
  section = "Audit Logging"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.2"
  section = "Monitoring of system components for anomalies"

  [[rules.compliance]]
  framework = "GDPR"
  control = "33"
  section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongodb-cis-6.1-non-default-port"
description = "CIS 6.1 - Ensure that MongoDB uses a non-default port"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "net_port"
  condition = "DIFFERENT"
  value = 27017

  [[rules.compliance]]
  framework = "CIS"
  control = "6.1"
  section = "Operating System Hardening"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.6"
  section = "Protection against threats from outside system boundaries"

  [[rules.compliance]]
  framework = "GDPR"
  control = "25"
  section = "Data protection by design and by default"


[[rules]]
name = "mongodb-cis-6.3-server-side-scripting-disabled"
description = "CIS 6.3 - Ensure that server-side scripting is disabled if not needed (security.javascriptEnabled: false)"
level = 1
object = "cmdLineOpts"

  [[rules.conditions]]
  property = "security_javascriptEnabled"
  condition = "EQUAL"
  value = false

  [[rules.compliance]]
  framework = "CIS"
  control = "6.3"
  section = "Operating System Hardening"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.e"
  section = "Security in acquisition, development and maintenance"

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC7.1"
  section = "Detection of configuration changes and vulnerabilities"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"
