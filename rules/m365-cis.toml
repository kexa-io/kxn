[[rules]]
name = "m365-cis-5.2.3.1-authenticator-number-context"
description = "CIS 5.2.3.1 - Ensure Microsoft Authenticator is configured to protect against MFA fatigue"
level = 1
object = "authentication_methods_policy"

  [[rules.compliance]]
  framework = "CIS"
  control = "5.2.3.1"
  section = "Microsoft Entra admin center"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "methods.MicrosoftAuthenticator.state", condition = "EQUAL", value = "enabled" },
    { property = "methods.MicrosoftAuthenticator.includeTargets", condition = "SOME", value = [{ property = "id", condition = "EQUAL", value = "all_users" }] },
    { property = "methods.MicrosoftAuthenticator.featureSettings.displayAppInformationRequiredState.state", condition = "EQUAL", value = "enabled" },
    { property = "methods.MicrosoftAuthenticator.featureSettings.displayAppInformationRequiredState.includeTarget.id", condition = "EQUAL", value = "all_users" },
    { property = "methods.MicrosoftAuthenticator.featureSettings.displayLocationInformationRequiredState.state", condition = "EQUAL", value = "enabled" },
    { property = "methods.MicrosoftAuthenticator.featureSettings.displayLocationInformationRequiredState.includeTarget.id", condition = "EQUAL", value = "all_users" },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


