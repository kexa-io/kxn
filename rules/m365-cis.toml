[metadata]
version = "2.0.0"
provider = "m365"
description = "CIS Microsoft 365 Foundations Benchmark v7.0.0"
tags = ["cis", "m365", "microsoft365", "entra-id", "exchange", "teams", "sharepoint", "defender"]

# Rule names carry the official v7.0.0 control numbers. Target: m365://
# (a read-only application: Graph read permissions, Exchange.ManageAsApp and
# the Global Reader role; see docs/providers.md).
#
# Covered: 119 of the 143 automated controls. Not covered here:
#   3.2.1-3.2.3, 3.3.1  DLP and sensitivity labels: Security & Compliance API
#   7.2.2, 7.2.4, 7.2.7-7.2.11, 7.3.1  SharePoint tenant settings Graph does not
#                       expose (SharePoint admin API, certificate auth only)
#   9.1.1-9.1.12        Microsoft Fabric tenant settings (Fabric admin API)
#   2.4.1               only the tenant switch is read; its alert policies live
#                       in the Security & Compliance API
# Manual controls of the benchmark (1.1.2, 1.3.8, 2.2.1, 2.4.3, 2.4.5, 5.1.2.1,
# 5.1.2.4-5.1.2.6, 5.1.3.2, 5.1.3.3, 5.2.4.x, 8.4.1) are not automated.
# 5.3.1, 5.3.4 and 5.3.5 need Entra ID P2: without it they fail, with the
# reason under tenant.errors.pim.


[[rules]]
name = "m365-cis-1.1.1-admin-accounts-cloud-only"
description = "CIS 1.1.1 - Ensure administrative accounts are cloud-only"
level = 2
object = "tenant"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1.1"
  section = "Microsoft 365 admin center"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "synced_admins"
  condition = "EQUAL"
  value = []

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "m365-cis-1.1.3-two-to-four-global-admins"
description = "CIS 1.1.3 - Ensure that between two and four global admins are designated"
level = 2
object = "tenant"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1.3"
  section = "Microsoft 365 admin center"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "global_admins", condition = "SUP_OR_EQUAL", value = 2 },
    { property = "global_admins", condition = "INF_OR_EQUAL", value = 4 },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


