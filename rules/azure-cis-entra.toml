[metadata]
version = "6.0.0"
provider = "microsoft.graph"
description = "CIS Microsoft Azure Foundations Benchmark v6.0.0 - Microsoft Entra ID controls"
tags = ["cis", "azure", "entra-id", "identity"]

# Security defaults need Policy.Read.All; the Azure CLI's own token does not
# carry it, so with `az login` alone 5.1.1 reports `enabled: null`.


[[rules]]
name = "azure-cis-5.1.1-security-defaults"
description = "CIS 5.1.1 - Ensure that 'security defaults' is enabled in Microsoft Entra ID"
level = 2
object = "security_defaults"

  [[rules.compliance]]
  framework = "CIS"
  control = "5.1.1"
  section = "Identity Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "enabled"
  condition = "EQUAL"
  value = true


[[rules]]
name = "azure-cis-5.1.3-mfa-all-users"
description = "CIS 5.1.3 - Ensure that multifactor authentication is enabled for all users"
level = 3
object = "user_mfa"

  [[rules.compliance]]
  framework = "CIS"
  control = "5.1.3"
  section = "Identity Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "mfa_registered"
  condition = "EQUAL"
  value = true
