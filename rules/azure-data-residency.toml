[metadata]
version = "1.0.0"
provider = "azure"
description = "Data residency (GDPR art. 44): Azure resources that hold data live in an EU or EEA region"
tags = ["azure", "gdpr", "data-residency"]

# The allowed regions are the Azure regions of the EU and EEA, and "global"
# (resources without a region). uksouth / ukwest and switzerlandnorth /
# switzerlandwest are outside the EU; the UK and Switzerland have an adequacy
# decision (art. 45), so a copy of this pack can add them to every list below.
# One rule per resource type: Resource Graph serves each type as its own object.

[[rules]]
name = "azure-residency-storage-accounts"
description = "Storage accounts are in an EU or EEA region (GDPR art. 44: transfers of personal data outside the EU)"
level = 1
object = "microsoft.storage/storageaccounts"

[[rules.conditions]]
property = "location"
condition = "IN"
value = ["northeurope", "westeurope", "francecentral", "francesouth", "germanywestcentral", "germanynorth", "swedencentral", "swedensouth", "italynorth", "polandcentral", "spaincentral", "austriaeast", "belgiumcentral", "denmarkeast", "norwayeast", "norwaywest", "global"]

[[rules.compliance]]
framework = "GDPR"
control = "44"
section = "Transfers of personal data to third countries"

[[rules.compliance]]
framework = "NIS2"
control = "21.2.i"
section = "Access control and asset management"

[[rules.compliance]]
framework = "SOC2"
control = "C1.1"
section = "Confidential information"

