[metadata]
version = "1.0.0"
provider = "azure"
description = "Azure Key Vault rotation checks"
tags = ["azure", "security", "key-vault", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Pattern:
#   - flag Key Vault secrets and keys that are past expiration_date
#   - flag entries with no expiration_date set (no lifecycle control)
#
# Objects are the native `azure` provider's `key_vault_secret` and
# `key_vault_key`: every key and secret of every vault the credentials can
# list, read through ARM (no data-plane access needed). `expiration_date` is
# the item's `exp` attribute, `rotation_policy` its rotation policy.

[[rules]]
name = "azure-kv-secret-past-expiration"
description = "Key Vault secret is past its expiration_date — rotate immediately"
level = 5
object = "key_vault_secret"
tags = ["azure", "rotation", "key-vault"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  # An item without an expiration date is the no-expiration rule's finding,
  # not this one's: it is not counted twice.
  operator = "OR"
  criteria = [
    { property = "expiration_date", condition = "EQUAL", value = "" },
    { property = "expiration_date", condition = "DATE_INF", value = "0" },
  ]

[[rules]]
name = "azure-kv-secret-no-expiration"
description = "Key Vault secret has no expiration_date set — cannot enforce rotation"
level = 3
object = "key_vault_secret"
tags = ["azure", "rotation", "key-vault", "policy"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "expiration_date", condition = "DIFFERENT", value = "" },
  ]

[[rules]]
name = "azure-kv-key-past-expiration"
description = "Key Vault key is past its expiration_date — rotate immediately"
level = 5
object = "key_vault_key"
tags = ["azure", "rotation", "key-vault"]

  [[rules.conditions]]
  # An item without an expiration date is the no-expiration rule's finding,
  # not this one's: it is not counted twice.
  operator = "OR"
  criteria = [
    { property = "expiration_date", condition = "EQUAL", value = "" },
    { property = "expiration_date", condition = "DATE_INF", value = "0" },
  ]

[[rules]]
name = "azure-kv-key-no-rotation-policy"
description = "Key Vault key has no rotation_policy configured"
level = 3
object = "key_vault_key"
tags = ["azure", "rotation", "key-vault", "policy"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "rotation_policy", condition = "DIFFERENT", value = "" },
  ]
