[metadata]
version = "1.0.0"
provider = "hashicorp/azurerm"
description = "Azure Key Vault rotation checks"
tags = ["azure", "security", "key-vault", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Pattern:
#   - flag Key Vault secrets and keys that are past expiration_date
#   - flag entries with no expiration_date set (no lifecycle control)
#
# Property names assume the Terraform azurerm_key_vault_secret /
# azurerm_key_vault_key data source schemas.

[[rules]]
name = "azure-kv-secret-past-expiration"
description = "Key Vault secret is past its expiration_date — rotate immediately"
level = 5
object = "azurerm_key_vault_secret"
tags = ["azure", "rotation", "key-vault"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "expiration_date", condition = "DATE_SUP", value = "0" },
  ]

[[rules]]
name = "azure-kv-secret-no-expiration"
description = "Key Vault secret has no expiration_date set — cannot enforce rotation"
level = 3
object = "azurerm_key_vault_secret"
tags = ["azure", "rotation", "key-vault", "policy"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "expiration_date", condition = "EQUAL", value = "" },
  ]

[[rules]]
name = "azure-kv-key-past-expiration"
description = "Key Vault key is past its expiration_date — rotate immediately"
level = 5
object = "azurerm_key_vault_key"
tags = ["azure", "rotation", "key-vault"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "expiration_date", condition = "DATE_SUP", value = "0" },
  ]

[[rules]]
name = "azure-kv-key-no-rotation-policy"
description = "Key Vault key has no rotation_policy configured"
level = 3
object = "azurerm_key_vault_key"
tags = ["azure", "rotation", "key-vault", "policy"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "rotation_policy", condition = "EQUAL", value = "" },
  ]
