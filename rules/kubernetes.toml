[metadata]
version = "1.0.0"
provider = "kubernetes"
description = "Kubernetes cluster monitoring and compliance rules"
tags = ["monitoring", "kubernetes", "cluster"]

[[rules]]
name = "k8s-pods-pending"
description = "No pods should be stuck in Pending state"
level = 2
object = "cluster_stats"
tags = ["pods", "health"]

  [[rules.conditions]]
  property = "pods_pending"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "k8s-pods-failed"
description = "No pods should be in Failed state"
level = 3
object = "cluster_stats"
tags = ["pods", "critical"]

  [[rules.conditions]]
  property = "pods_failed"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "k8s-excessive-restarts"
description = "Total container restarts across cluster should be low"
level = 2
object = "cluster_stats"
tags = ["pods", "restarts"]

  [[rules.conditions]]
  property = "total_restarts"
  condition = "INF"
  value = 100

# Pod-level companion rules to k8s-excessive-restarts. The cluster_stats
# rule above is a single aggregate row that doesn't say which container
# is responsible; these fire per (namespace, pod, container) so the
# webhook payload carries the noisy pod's identity directly.

[[rules]]
name = "k8s-pod-high-restart-count"
description = "Container restart count is high — likely crashloop or stuck retry"
level = 3
object = "pod_restarts"
tags = ["pods", "restarts", "crashloop"]

# restart_count is lifetime-cumulative and never resets except on pod
# recreation (see kexa-io/kxn#170) — a single resolved incident trips
# this forever. Require the last restart to also be recent (within the
# last hour): pass if restart_count is low OR the last restart is old,
# so the alert only fires while the pod is genuinely still restarting.
  [[rules.conditions]]
  operator = "OR"
  criteria = [
    { property = "restart_count", condition = "INF", value = 20 },
    { property = "last_restart_age_seconds", condition = "SUP", value = 3600 },
  ]

[[rules]]
name = "k8s-pod-oomkilled"
description = "Container last terminated by OOMKilled — bump memory limit"
level = 4
object = "pod_restarts"
tags = ["pods", "restarts", "oom", "resources"]

  [[rules.conditions]]
  property = "oom_killed"
  condition = "EQUAL"
  value = true

[[rules]]
name = "k8s-nodes-not-ready"
description = "All nodes should be Ready"
level = 3
object = "cluster_stats"
tags = ["nodes", "critical"]

  [[rules.conditions]]
  property = "nodes_not_ready"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "k8s-deployments-unavailable"
description = "No deployments should have unavailable replicas"
level = 2
object = "cluster_stats"
tags = ["deployments", "health"]

  [[rules.conditions]]
  property = "deployments_unavailable"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "k8s-warning-events"
description = "Warning events should be minimal"
level = 1
object = "cluster_stats"
tags = ["events", "warning"]

  [[rules.conditions]]
  property = "warning_events"
  condition = "INF"
  value = 50

# Every container must declare `resources.limits`. A container without the
# key resolves to "" so EQUAL "" catches it; NOT_ANY fails the pod as soon as
# one container has no limits. Per-container CPU/memory detail lives in
# kubernetes-resources.toml (object `pod_efficiency`).
[[rules]]
name = "k8s-pod-resource-limits"
description = "All pods should have resource limits defined on every container"
level = 1
object = "pods"
tags = ["resources", "best-practice"]

  [[rules.conditions]]
  property = "containers"
  condition = "NOT_ANY"
  value = { property = "resources.limits", condition = "EQUAL", value = "" }
