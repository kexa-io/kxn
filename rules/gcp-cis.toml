[metadata]
version = "3.0.0"
provider = "gcp"
description = "CIS Google Cloud Platform Foundations Benchmark v3.0.0"
tags = ["cis", "gcp", "security", "cloud"]

# Rule names carry the official v3.0.0 control numbers.
#
# Every automated control is here, and five of the benchmark's manual ones
# that the APIs can answer (1.1, 1.13, 1.17, 3.9, 3.10). Not here:
#   1.2, 1.3  MFA and security keys: Google Workspace settings, checked by
#             rules/google-workspace-cis.toml (gw-cis-1.1, gw-cis-1.2).
#   2.14      Access Transparency: an organization setting with no read API.
#   4.10      App Engine HTTPS: per-handler `secure: always` in app.yaml.
#   4.12      OS updates: needs VM Manager (OS Config) on every instance.
#   6.1.1     MySQL root password: not exposed by the Cloud SQL Admin API.
#   7.4       BigQuery data classification: an organizational process.
#
# Objects named `service.googleapis.com/Kind` are Cloud Asset Inventory types:
# the resource as its own API returns it, plus `_asset` and `_iam`.


[[rules]]
name = "gcp-cis-1.1-corporate-login-credentials"
description = "CIS 1.1 - Ensure that corporate login credentials are used (no consumer Gmail accounts hold project roles)"
level = 2
object = "project_iam_member"
apply_to = "member_type=user"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "member_id"
  condition = "NOT_REGEX"
  value = '(?i)@(gmail|googlemail)\.com$'


[[rules]]
name = "gcp-cis-1.4-only-gcp-managed-sa-keys"
description = "CIS 1.4 - Ensure that there are only GCP-managed service account keys for each service account"
level = 2
object = "iam_service_accounts"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.4"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "key_count"
  condition = "EQUAL"
  value = 0


[[rules]]
name = "gcp-cis-1.5-sa-no-admin-privileges"
description = "CIS 1.5 - Ensure that service accounts have no admin privileges (owner, editor or *Admin roles)"
level = 3
object = "project_iam_member"
apply_to = "member_type=serviceAccount"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.5"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "role"
  condition = "NOT_REGEX"
  value = "^roles/(owner|editor)$|[Aa]dmin$"


[[rules]]
name = "gcp-cis-1.6-no-sa-user-or-token-creator-at-project"
description = "CIS 1.6 - Ensure that IAM users are not assigned the Service Account User or Service Account Token Creator roles at project level"
level = 2
object = "project_iam_member"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.6"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "role"
  condition = "NOT_IN"
  value = ["roles/iam.serviceAccountUser", "roles/iam.serviceAccountTokenCreator"]


[[rules]]
name = "gcp-cis-1.7-sa-keys-rotated-90-days"
description = "CIS 1.7 - Ensure user-managed/external keys for service accounts are rotated every 90 days or fewer"
level = 2
object = "service_account_keys"
apply_to = "key_type=USER_MANAGED"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.7"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "valid_after_time"
  condition = "DATE_INF"
  value = "0 0 0 90"


[[rules]]
name = "gcp-cis-1.8-sa-separation-of-duties"
description = "CIS 1.8 - Ensure that separation of duties is enforced while assigning service account related roles to users"
level = 2
object = "project_iam_member"
apply_to = "role=roles/iam.serviceAccountAdmin"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.8"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "member_roles"
  condition = "NOT_INCLUDE"
  value = "roles/iam.serviceAccountUser"


[[rules]]
name = "gcp-cis-1.9-kms-key-not-public"
description = "CIS 1.9 - Ensure that Cloud KMS cryptokeys are not anonymously or publicly accessible"
level = 3
object = "cloudkms.googleapis.com/CryptoKey"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.9"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "_iam.public"
  condition = "EQUAL"
  value = false


[[rules]]
name = "gcp-cis-1.9-kms-keyring-not-public"
description = "CIS 1.9 - Ensure that Cloud KMS key rings (whose IAM every key inherits) are not anonymously or publicly accessible"
level = 3
object = "cloudkms.googleapis.com/KeyRing"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.9"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "_iam.public"
  condition = "EQUAL"
  value = false


[[rules]]
name = "gcp-cis-1.10-kms-rotation-90-days"
description = "CIS 1.10 - Ensure KMS encryption keys are rotated within a period of 90 days"
level = 2
object = "kms_crypto_key"
apply_to = "purpose=ENCRYPT_DECRYPT"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.10"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "rotation_period_days"
  condition = "INF_OR_EQUAL"
  value = 90


[[rules]]
name = "gcp-cis-1.11-kms-separation-of-duties"
description = "CIS 1.11 - Ensure that separation of duties is enforced while assigning KMS related roles to users"
level = 2
object = "project_iam_member"
apply_to = "role=roles/cloudkms.admin"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.11"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "member_roles", condition = "NOT_INCLUDE", value = "roles/cloudkms.cryptoKeyEncrypterDecrypter" },
    { property = "member_roles", condition = "NOT_INCLUDE", value = "roles/cloudkms.cryptoKeyEncrypter" },
    { property = "member_roles", condition = "NOT_INCLUDE", value = "roles/cloudkms.cryptoKeyDecrypter" },
  ]


[[rules]]
name = "gcp-cis-1.12-no-api-keys"
description = "CIS 1.12 - Ensure API keys only exist for active services (CIS recommends using none: every key is reported)"
level = 1
object = "api_keys"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.12"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.conditions]]
  property = "id"
  condition = "EQUAL"
  value = ""


[[rules]]
name = "gcp-cis-1.13-api-keys-app-restricted"
description = "CIS 1.13 - Ensure API keys are restricted to use by only specified hosts and apps"
level = 1
