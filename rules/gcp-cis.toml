  framework = "CIS"
  control = "1.16"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.conditions]]
  property = "essential_contacts_configured"
  condition = "EQUAL"
