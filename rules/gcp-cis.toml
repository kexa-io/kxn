[[rules]]
name = "gcp-cis-1.17-no-secrets-in-function-env"
description = "CIS 1.17 - Ensure secrets are not stored in Cloud Functions environment variables (use Secret Manager)"
level = 2
object = "cloud_functions"

  [[rules.compliance]]
  framework = "CIS"
