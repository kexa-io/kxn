  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.conditions]]
  property = "secret_like_env_vars"
  condition = "COUNT"
  value = 0


[[rules]]
name = "gcp-cis-2.1-audit-logging-all-services"
description = "CIS 2.1 - Ensure that Cloud Audit Logging is configured properly (DATA_READ and DATA_WRITE for all services, no exempted users)"
level = 2
object = "project"

  [[rules.compliance]]
  framework = "CIS"
  control = "2.1"
  section = "Logging and Monitoring"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.b"
  section = "Incident handling"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.10"
  section = "Detection"

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "audit_log_types", condition = "INCLUDE", value = "DATA_READ" },
    { property = "audit_log_types", condition = "INCLUDE", value = "DATA_WRITE" },
    { property = "audit_exempted_members", condition = "COUNT", value = 0 },
  ]


[[rules]]
name = "gcp-cis-2.2-sink-for-all-log-entries"
description = "CIS 2.2 - Ensure that sinks are configured for all log entries (a sink without filter)"
level = 1
object = "project"

  [[rules.compliance]]
  framework = "CIS"
  control = "2.2"
  section = "Logging and Monitoring"

  [[rules.compliance]]
  framework = "NIS2"
