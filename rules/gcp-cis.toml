  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.conditions]]
  property = "app_restricted"
  condition = "EQUAL"
  value = true


[[rules]]
name = "gcp-cis-1.14-api-keys-api-restricted"
description = "CIS 1.14 - Ensure API keys are restricted to only APIs that the application needs access to"
level = 1
object = "api_keys"

  [[rules.compliance]]
  framework = "CIS"
  control = "1.14"
  section = "Identity and Access Management"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.g"
  section = "Cyber hygiene and training"

  [[rules.conditions]]
  property = "api_restricted"
  condition = "EQUAL"
  value = true


[[rules]]
