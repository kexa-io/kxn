  [[rules.compliance]]
  framework = "CIS"
  control = "6.3.3"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "flags.user connections"
  condition = "REGEX"
  value = "^(0)?$"


[[rules]]
name = "gcp-cis-6.3.4-sqlserver-user-options-unset"
description = "CIS 6.3.4 - Ensure 'user options' database flag for Cloud SQL SQL Server instance is not configured"
level = 2
object = "cloud_sql_instances"
apply_to = "engine=sqlserver"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.3.4"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "flags.user options"
  condition = "EQUAL"
  value = ""


[[rules]]
name = "gcp-cis-6.3.5-sqlserver-remote-access-off"
description = "CIS 6.3.5 - Ensure 'remote access' database flag for Cloud SQL SQL Server instance is set to 'off'"
level = 2
object = "cloud_sql_instances"
apply_to = "engine=sqlserver"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.3.5"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "flags.remote access"
  condition = "EQUAL"
  value = "off"


[[rules]]
name = "gcp-cis-6.3.6-sqlserver-trace-flag-3625"
description = "CIS 6.3.6 - Ensure '3625 (trace flag)' database flag for all Cloud SQL Server instances is set to 'on'"
level = 2
object = "cloud_sql_instances"
apply_to = "engine=sqlserver"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.3.6"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "flags.3625"
  condition = "EQUAL"
  value = "on"


[[rules]]
name = "gcp-cis-6.3.7-sqlserver-contained-db-auth-off"
description = "CIS 6.3.7 - Ensure that the 'contained database authentication' database flag for Cloud SQL on the SQL Server instance is set to 'off'"
level = 2
object = "cloud_sql_instances"
apply_to = "engine=sqlserver"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.3.7"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "flags.contained database authentication"
  condition = "REGEX"
  value = "^(off)?$"


[[rules]]
name = "gcp-cis-6.4-sql-require-ssl"
description = "CIS 6.4 - Ensure that the Cloud SQL database instance requires all incoming connections to use SSL"
level = 3
object = "cloud_sql_instances"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.4"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "ssl_enforced"
  condition = "EQUAL"
  value = true


[[rules]]
name = "gcp-cis-6.5-sql-no-world-authorized-network"
description = "CIS 6.5 - Ensure that Cloud SQL database instances do not implicitly whitelist all public IP addresses"
level = 3
object = "cloud_sql_instances"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.5"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.4"
  section = "Protection - network security"

  [[rules.conditions]]
  property = "authorized_networks"
  condition = "NOT_INCLUDE"
  value = "0.0.0.0/0"


[[rules]]
name = "gcp-cis-6.6-sql-no-public-ip"
description = "CIS 6.6 - Ensure that Cloud SQL database instances do not have public IPs"
level = 2
object = "cloud_sql_instances"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.6"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.4"
  section = "Protection - network security"

  [[rules.conditions]]
  property = "public_ip"
  condition = "EQUAL"
  value = false


[[rules]]
name = "gcp-cis-6.7-sql-automated-backups"
description = "CIS 6.7 - Ensure that Cloud SQL database instances are configured with automated backups"
level = 2
object = "cloud_sql_instances"
apply_to = "instanceType=CLOUD_SQL_INSTANCE"

  [[rules.compliance]]
  framework = "CIS"
  control = "6.7"
  section = "Cloud SQL Database Services"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.c"
  section = "Business continuity"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.12"
  section = "Backup policies and recovery"

  [[rules.conditions]]
  property = "backups_enabled"
  condition = "EQUAL"
  value = true


[[rules]]
name = "gcp-cis-7.1-bigquery-dataset-not-public"
description = "CIS 7.1 - Ensure that BigQuery datasets are not anonymously or publicly accessible"
