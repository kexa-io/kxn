[metadata]
version = "1.0.0"
provider = "ssh"
description = "SSH package update monitoring rules"

[[rules]]
name = "ssh-packages-no-upgradable"
description = "Alert when packages are available for upgrade (apt/yum/apk)"
level = 1
object = "packages"

  [[rules.conditions]]
  property = "upgradable_count"
  condition = "EQUAL"
  value = 0

[[rules.compliance]]
framework = "NIS2"
control = "21.2.e"
section = "Security in acquisition, development and maintenance"

[[rules.compliance]]
framework = "SOC2"
control = "CC7.1"
section = "Detection of configuration changes and vulnerabilities"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.b"
section = "Confidentiality, integrity, availability and resilience of processing systems"

[[rules]]
name = "ssh-packages-critical-upgradable"
description = "Critical alert when more than 50 packages need upgrading"
level = 2
object = "packages"

  [[rules.conditions]]
  property = "upgradable_count"
  condition = "INF"
  value = 50

[[rules.compliance]]
framework = "NIS2"
control = "21.2.e"
section = "Security in acquisition, development and maintenance"

[[rules.compliance]]
framework = "SOC2"
control = "CC7.1"
section = "Detection of configuration changes and vulnerabilities"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.b"
section = "Confidentiality, integrity, availability and resilience of processing systems"

[[rules]]
name = "ssh-packages-security-libs"
description = "Alert when security-critical packages (openssl, libssl, openssh, sudo, kernel) have updates"
level = 2
object = "packages"
tags = ["security"]

  [[rules.conditions]]
  property = "packages"
  condition = "NOT_ANY"
  value = { property = "name", condition = "REGEX", value = "^(openssl|libssl|openssh|sudo|linux-image|kernel)" }

[[rules.compliance]]
framework = "NIS2"
control = "21.2.e"
section = "Security in acquisition, development and maintenance"

[[rules.compliance]]
framework = "SOC2"
control = "CC7.1"
section = "Detection of configuration changes and vulnerabilities"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.b"
section = "Confidentiality, integrity, availability and resilience of processing systems"
