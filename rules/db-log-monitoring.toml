[metadata]
version = "1.0.0"
provider = "postgresql"
description = "Database log monitoring rules — detect errors and slow queries across all DB providers"
tags = ["monitoring", "logs", "database"]

[[rules]]
name = "db-log-errors"
description = "Database should have no recent error log entries"
level = 2
object = "logs"
tags = ["errors", "database"]

  [[rules.conditions]]
  property = "error_count"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "db-log-warnings"
description = "Database warnings should be minimal"
level = 1
object = "logs"
tags = ["warnings", "database"]

  [[rules.conditions]]
  property = "warning_count"
  condition = "INF"
  value = 20

# `db-slow-queries` is retired, not ported: it read `slow_query_count` on the
# `logs` object, which no collector produces. Counting slow queries means either
# parsing the server log file or reading `pg_stat_statements`, an extension that
# is not installed by default — so the rule could never fire, and the missing
# property was read as an empty string and reported as a violation on every
# database instead.

