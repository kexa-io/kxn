[metadata]
version = "1.0.0"
provider = "hashicorp/vault"
description = "HashiCorp Vault KV v2 secret age checks"
tags = ["vault", "security", "kv", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Vault KV does not expose a rotation policy — static secrets must be
# rotated by the owning team. We surface stale entries by their KV v2
# metadata.updated_time. Dynamic-engine secrets (database, aws, pki, ...)
# are out of scope here; their TTL is enforced server-side.
#
# Property names assume the Terraform vault_kv_secret_v2 data source.

[[rules]]
name = "vault-kv-secret-not-rotated-90-days"
description = "KV v2 secret has not been updated for 90 days — rotate"
level = 2
object = "vault_kv_secret_v2"
tags = ["vault", "rotation", "kv"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "metadata.updated_time", condition = "DATE_SUP", value = "0 0 0 90" },
  ]

[[rules]]
name = "vault-kv-secret-not-rotated-180-days"
description = "KV v2 secret has not been updated for 180 days — overdue rotation"
level = 4
object = "vault_kv_secret_v2"
tags = ["vault", "rotation", "kv", "overdue"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "metadata.updated_time", condition = "DATE_SUP", value = "0 0 0 180" },
  ]

[[rules]]
name = "vault-kv-secret-stale-365-days"
description = "KV v2 secret has not been updated for a year — critical rotation overdue"
level = 5
object = "vault_kv_secret_v2"
tags = ["vault", "rotation", "kv", "stale"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "metadata.updated_time", condition = "DATE_SUP", value = "0 0 0 365" },
  ]
