[metadata]
version = "1.0.0"
provider = "azure"
description = "Azure hardening beyond the CIS Foundations Benchmark (compute, databases, containers, RBAC)"
tags = ["azure", "security", "best-practices"]


[[rules]]
name = "azure-rbac-no-contributor-at-subscription"
description = "Contributor is not granted on the whole subscription"
level = 2
object = "microsoft.authorization/roleassignments"
tags = ["rbac"]

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  operator = "NAND"
  criteria = [
    { property = "properties.scope", condition = "REGEX", value = "(?i)^/subscriptions/[^/]+$" },
    { property = "properties.roleDefinitionId", condition = "REGEX", value = "(?i)b24988ac-6180-42a0-ab88-20f7382dd24c$" },
  ]

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "azure-rbac-no-classic-administrators"
description = "No classic (co-)administrators remain on the subscription (every one is reported)"
level = 2
object = "microsoft.authorization/classicadministrators"
tags = ["rbac"]

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.i"
  section = "Access control and asset management"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.3"
  section = "Protection - access management"

  [[rules.conditions]]
  property = "id"
  condition = "EQUAL"
  value = ""

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.b"
  section = "Confidentiality, integrity, availability and resilience of processing systems"


[[rules]]
name = "azure-storage-infrastructure-encryption"
description = "Storage accounts use infrastructure (double) encryption"
level = 1
object = "storage_account"

  [[rules.compliance]]
  framework = "NIS2"
  control = "21.2.h"
  section = "Cryptography"

  [[rules.compliance]]
  framework = "DORA"
  control = "art.9.2"
  section = "Protection - data security"

  [[rules.conditions]]
  property = "properties.encryption.requireInfrastructureEncryption"
  condition = "EQUAL"
  value = true

  [[rules.compliance]]
  framework = "SOC2"
  control = "CC6.1"
  section = "Logical access security and encryption"

  [[rules.compliance]]
  framework = "GDPR"
  control = "32.1.a"
  section = "Pseudonymisation and encryption of personal data"


