[metadata]
version = "1.0.0"
provider = "mongodb"
description = "MongoDB monitoring rules: connections, locks, cache, long operations, authentication failures and server log"
tags = ["monitoring", "mongodb", "database", "performance"]

[[rules]]
name = "mongo-globallock-queue"
description = "Global lock queue should be empty"
level = 2
object = "db_stats"
tags = ["locks", "performance"]

  [[rules.conditions]]
  property = "globallock_queue_total"
  condition = "EQUAL"
  value = 0

[[rules]]
name = "mongo-cursors-timed-out"
description = "Timed-out cursors indicate client issues"
level = 1
object = "db_stats"
tags = ["cursors", "warning"]

  [[rules.conditions]]
  property = "cursors_timed_out"
  condition = "INF"
  value = 100

[[rules]]
name = "mongo-cache-usage-high"
description = "WiredTiger cache usage should not exceed 80%"
level = 2
object = "db_stats"
tags = ["cache", "performance"]

  [[rules.conditions]]
  property = "wt_cache_bytes_current"
  condition = "INF"
  value = 8589934592

[[rules]]
name = "mongo-memory-resident-high"
description = "Resident memory should stay under control"
level = 1
object = "db_stats"
tags = ["memory", "performance"]

  [[rules.conditions]]
  property = "memory_resident_mb"
  condition = "INF"
  value = 4096

[[rules]]
name = "mongo-replication-secondary"
description = "Track if this node is primary or secondary"
level = 0
object = "db_stats"
tags = ["replication", "info"]

  [[rules.conditions]]
  property = "replication_is_primary"
  condition = "EQUAL"
  value = 1

[[rules.compliance]]
framework = "NIS2"
control = "21.2.c"
section = "Business continuity"

[[rules.compliance]]
framework = "SOC2"
control = "A1.2"
section = "Backup and recovery infrastructure"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.c"
section = "Ability to restore availability and access to personal data"

[[rules]]
name = "mongo-connections-high"
description = "Connections in use should stay below 80% of the limit"
level = 1
object = "db_stats"

  [[rules.conditions]]
  property = "connections_used_percent"
  condition = "INF"
  value = 80


[[rules]]
name = "mongo-auth-failures"
description = "Failed authentications since start should stay low (more than 100 suggests a misconfigured client or password guessing)"
level = 1
object = "db_stats"

  [[rules.conditions]]
  property = "auth_failures"
  condition = "INF"
  value = 100

[[rules.compliance]]
framework = "NIS2"
control = "21.2.b"
section = "Incident handling"

[[rules.compliance]]
framework = "SOC2"
control = "CC7.2"
section = "Monitoring of system components for anomalies"

[[rules.compliance]]
framework = "GDPR"
control = "33"
section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongo-long-running-operation"
description = "No active operation should run for more than 5 minutes"
level = 1
object = "currentOp"
apply_to = "active=true"

  [[rules.conditions]]
  property = "secs_running"
  condition = "INF"
  value = 300


[[rules]]
name = "mongo-log-errors"
description = "The server log should have no recent error or fatal entries"
level = 2
object = "logs"

  [[rules.conditions]]
  property = "error_count"
  condition = "EQUAL"
  value = 0


[[rules]]
name = "mongo-log-auth-failures"
description = "The server log should not show repeated authentication failures (10 or more in the recent log)"
level = 1
object = "logs"

  [[rules.conditions]]
  property = "auth_failure_count"
  condition = "INF"
  value = 10

[[rules.compliance]]
framework = "NIS2"
control = "21.2.b"
section = "Incident handling"

[[rules.compliance]]
framework = "SOC2"
control = "CC7.2"
section = "Monitoring of system components for anomalies"

[[rules.compliance]]
framework = "GDPR"
control = "33"
section = "Notification of a personal data breach (detection)"


[[rules]]
name = "mongo-user-scram-sha256"
description = "Every account should be able to authenticate with SCRAM-SHA-256, not SCRAM-SHA-1 only"
level = 1
object = "users"

  [[rules.conditions]]
  property = "scram_sha256"
  condition = "EQUAL"
  value = true

[[rules.compliance]]
framework = "NIS2"
control = "21.2.h"
section = "Cryptography"

[[rules.compliance]]
framework = "SOC2"
control = "CC6.1"
section = "Logical access security and encryption"

[[rules.compliance]]
framework = "GDPR"
control = "32.1.a"
section = "Pseudonymisation and encryption of personal data"
