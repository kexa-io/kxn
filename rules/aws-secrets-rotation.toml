[metadata]
version = "1.0.0"
provider = "hashicorp/aws"
description = "AWS Secrets Manager + KMS rotation checks"
tags = ["aws", "security", "secrets-manager", "kms", "rotation"]

# Compliance: NIST SP 800-57 (key lifecycle), PCI-DSS 3.6.4, SOC 2 CC6.1,
# ISO 27001 A.10.1.2.
#
# Pattern:
#   - flag secrets with rotation disabled
#   - flag secrets where last_rotated_date is older than 90 days
#   - flag customer-managed KMS keys without automatic rotation enabled
#
# Property names assume the Terraform aws_secretsmanager_secret and
# aws_kms_key data source schemas.

[[rules]]
name = "aws-secret-rotation-disabled"
description = "Secret has rotation disabled — manual rotation only, no compliance proof"
level = 3
object = "aws_secretsmanager_secret"
tags = ["aws", "rotation", "secrets-manager", "policy"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.compliance]]
  framework = "SOC2"
  controls = ["CC6.1"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "rotation_enabled", condition = "EQUAL", value = false },
  ]

[[rules]]
name = "aws-secret-not-rotated-90-days"
description = "Last rotation older than 90 days — rotate"
level = 2
object = "aws_secretsmanager_secret"
tags = ["aws", "rotation", "secrets-manager"]

  [[rules.compliance]]
  framework = "PCI-DSS"
  controls = ["3.6.4"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "rotation_enabled", condition = "EQUAL", value = true },
    { property = "last_rotated_date", condition = "DATE_SUP", value = "0 0 0 90" },
  ]

[[rules]]
name = "aws-secret-not-rotated-180-days"
description = "Last rotation older than 180 days — overdue"
level = 4
object = "aws_secretsmanager_secret"
tags = ["aws", "rotation", "secrets-manager", "overdue"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "last_rotated_date", condition = "DATE_SUP", value = "0 0 0 180" },
  ]

[[rules]]
name = "aws-kms-key-rotation-disabled"
description = "Customer-managed KMS key has automatic rotation disabled"
level = 3
object = "aws_kms_key"
tags = ["aws", "rotation", "kms", "policy"]

  [[rules.compliance]]
  framework = "NIST-SP-800-57"
  controls = ["5.3.6"]

  [[rules.conditions]]
  operator = "AND"
  criteria = [
    { property = "key_manager", condition = "EQUAL", value = "CUSTOMER" },
    { property = "enable_key_rotation", condition = "EQUAL", value = false },
  ]
