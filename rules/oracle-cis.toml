[[rules]]
name = "oracle-cis-5.1.1-system-actions-audited"
description = "CIS 5.1.1 - Ensure All Auditable System Actions Commands Are Audited (account, role, privilege, profile, database link, system, PDB and audit-policy changes, by an enabled unified policy for all users)"
level = 2
object = "instance"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE USER"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER USER"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "DROP USER"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE ROLE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER ROLE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "DROP ROLE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "GRANT"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "REVOKE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE PROFILE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER PROFILE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "DROP PROFILE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE DATABASE LINK"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER DATABASE LINK"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "DROP DATABASE LINK"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER SYSTEM"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER DATABASE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE PLUGGABLE DATABASE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER PLUGGABLE DATABASE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "DROP PLUGGABLE DATABASE"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "CREATE AUDIT POLICY"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "ALTER AUDIT POLICY"

  [[rules.conditions]]
