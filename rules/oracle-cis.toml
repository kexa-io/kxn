  condition = "INCLUDE"
  value = "DROP AUDIT POLICY"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "AUDIT"

  [[rules.conditions]]
  property = "audited_actions"
  condition = "INCLUDE"
  value = "NOAUDIT"

  [[rules.compliance]]
  framework = "CIS"
  control = "5.1.1"
  section = "Audit/Logging Policies and Procedures"


