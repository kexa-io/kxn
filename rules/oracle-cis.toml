[metadata]
version = "2.0.0"
provider = "oracle"
description = "CIS Oracle Database 19c Benchmark v2.0.0 (Level 1)"
tags = ["cis", "oracle", "database", "security"]

# CIS Oracle Database 19c Benchmark v2.0.0, the Level 1 controls Tenable
# publishes, read through a database connection (DBA or SELECT_CATALOG_ROLE).
# Section 6 is checked for every user and role Oracle does not maintain.
#
# Not automated here:
#   2.1.x and 2.2.x: listener.ora and sqlnet.ora, files on the host.
#   3.6 password verify function meets the organisation's standard: review.
#   4.2 custom ORACLE_MAINTAINED users: needs the list of accounts Oracle ships.
#   4.6 RAC password files identical across instances.
#   4.8 database link password storage: reads SYS.LINK$, which needs SYS.
#   5.1.3 critical packages and 5.1.5 SYS* privilege auditing: review of the
#         unified audit policies against your list.
#   6.1.11 every SYSTEM privilege and 6.8.2 directory objects: reviews.
# 5.1.1 checks the account, role, privilege, profile, database link, system,
# PDB and audit-policy actions; review the policy for any other action.

[[rules]]
name = "oracle-cis-1.1-supported-version"
description = "CIS 1.1 - Ensure That Appropriate Version/Patches For Oracle Software Are Installed (19c or later; patch level reviewed against the latest Release Update)"
level = 1
object = "instance"

  [[rules.conditions]]
  property = "version_major"
  condition = "SUP_OR_EQUAL"
  value = 19

  [[rules.compliance]]
  framework = "CIS"
  control = "1.1"
  section = "Database Installation and Patching"


